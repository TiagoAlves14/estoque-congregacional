openapi: 3.1.0
info:
  title: API do Estoque Congregacional
  version: 0.2.0
  description: |
    Contrato proposto para a sessão BFF, produtos e movimentações de estoque.
    O navegador autentica-se com cookie opaco; JWTs permanecem no servidor.
    A URL de servidor é ilustrativa e será definida na implementação.
servers:
  - url: https://app.example.com
    description: Placeholder; não representa um ambiente existente
security:
  - cookieAuth: []
tags:
  - name: Session
    description: Login, consulta e encerramento da sessão BFF
  - name: Products
    description: Cadastro e consulta de produtos
  - name: Movements
    description: Entradas, saídas e histórico
paths:
  /auth/login:
    get:
      tags: [Session]
      operationId: beginLogin
      summary: Inicia Authorization Code com PKCE no BFF
      security: []
      responses:
        '302':
          description: Redirecionamento ao Managed Login do Cognito
          headers:
            Location:
              description: URL de autorização com state e code_challenge
              schema:
                type: string
                format: uri
  /auth/callback:
    get:
      tags: [Session]
      operationId: completeLogin
      summary: Valida o callback OAuth e cria a sessão no servidor
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '302':
          description: Sessão criada e redirecionamento de volta à SPA
          headers:
            Location:
              description: URL da SPA, sem tokens na query ou fragmento
              schema:
                type: string
                format: uri-reference
            Set-Cookie:
              description: Cookie __Host-ec_session com Secure, HttpOnly, SameSite=Strict e Path=/
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Retorna identidade mínima e token CSRF, nunca tokens OAuth
      responses:
        '200':
          description: Sessão válida
          headers:
            X-CSRF-Token:
              $ref: '#/components/headers/CsrfToken'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Session]
      operationId: endSession
      summary: Revoga a sessão no servidor e expira o cookie
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Sessão encerrada
          headers:
            Set-Cookie:
              description: Cookie de sessão expirado
              schema:
                type: string
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Lista produtos por nome
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: namePrefix
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        '200':
          description: Página de produtos
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Cadastra produto com saldo inicial zero
      description: Operação permitida apenas ao papel ADMIN.
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Produto criado
          headers:
            Location:
              description: URI do produto criado
              schema:
                type: string
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: './schemas/product.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Consulta produto e saldo atual
      responses:
        '200':
          description: Produto encontrado
          headers:
            ETag:
              description: Versão usada para controle de concorrência
              schema:
                type: string
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: './schemas/product.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Altera dados ou estado do produto
      description: Operação permitida apenas ao papel ADMIN. O saldo não pode ser alterado por este recurso.
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: If-Match
          in: header
          required: true
          description: Versão retornada no ETag da consulta anterior
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Produto atualizado
          headers:
            ETag:
              description: Nova versão do produto
              schema:
                type: string
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: './schemas/product.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/products/{productId}/movements:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Movements]
      operationId: listProductMovements
      summary: Lista o histórico imutável do produto
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Página de movimentações
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Movements]
      operationId: createStockMovement
      summary: Registra entrada ou saída de estoque
      x-required-roles: [ADMIN, OPERATOR]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMovementRequest'
      responses:
        '201':
          description: Movimentação criada
          headers:
            Location:
              description: URI lógica da movimentação criada
              schema:
                type: string
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: './schemas/stock-movement.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Saldo insuficiente, produto inativo, concorrência ou reutilização inválida da chave
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-ec_session
      description: Identificador opaco de sessão; JWTs permanecem no BFF conforme o ADR-003
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco retornado pela página anterior
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave única por usuário e intenção de movimentação
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token anti-CSRF vinculado à sessão e exigido em operações que alteram estado
      schema:
        type: string
        minLength: 32
        maxLength: 256
  headers:
    CorrelationId:
      description: Identificador de correlação da requisição
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CsrfToken:
      description: Token anti-CSRF vinculado à sessão; a SPA deve mantê-lo somente em memória
      schema:
        type: string
        minLength: 32
        maxLength: 256
  schemas:
    SessionView:
      type: object
      additionalProperties: false
      required: [actorId, roles]
      properties:
        actorId:
          type: string
          minLength: 1
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [ADMIN, OPERATOR]
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, category, unit, minimumStock]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        category:
          type: string
          minLength: 1
          maxLength: 60
        unit:
          type: string
          enum: [UNIT, PACKAGE, LITER, KILOGRAM]
        minimumStock:
          type: integer
          minimum: 0
    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        category:
          type: string
          minLength: 1
          maxLength: 60
        unit:
          type: string
          enum: [UNIT, PACKAGE, LITER, KILOGRAM]
        minimumStock:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    CreateMovementRequest:
      type: object
      additionalProperties: false
      required: [type, quantity, reason]
      properties:
        type:
          type: string
          enum: [ENTRY, EXIT]
        quantity:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 200
    ProductPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: './schemas/product.schema.json'
        nextCursor:
          type: [string, 'null']
    MovementPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: './schemas/stock-movement.schema.json'
        nextCursor:
          type: [string, 'null']
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          examples: [INSUFFICIENT_STOCK]
        detail:
          type: string
        correlationId:
          type: string
  responses:
    BadRequest:
      description: Requisição inválida
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Sessão ausente, inválida, expirada ou revogada
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Usuário sem permissão, origem não permitida ou proteção CSRF inválida
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso não encontrado
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Estado ou versão incompatível com a operação
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
